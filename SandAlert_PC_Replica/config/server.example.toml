[server]
host = "127.0.0.1"
port = 8765
token = "change-me"
database_url = "sqlite:///./runtime/sandalert.sqlite3"
waveform_dir = "./runtime/waveforms"
threshold_margin = 0.008
calibration_factor = 1.2
caution_limit = 0.05
alarm_limit = 0.10
dsp_sample_rate = 1000
tdoa_enabled = true
# 现场频谱确认前保持关闭；启用后仅在 GCC-PHAT 频域内保留该频带。
tdoa_bandpass_enabled = false
tdoa_band_low_hz = 100000.0
tdoa_band_high_hz = 300000.0
ml_enabled = false
ml_model_path = "./runtime/ml-models/candidate.onnx"
ml_manifest_path = "./runtime/ml-models/candidate.manifest.json"
# Route B 专用机械干扰前置拒绝器；不配置时完全不启用。
# ml_mechanical_rejector_path = "./runtime/ml-models/mechanical_rejector.json"
ml_max_emit_hz = 20.0
ml_background_seconds = 1.0
ml_background_min_frames = 32
# 可选气速只进入 ML 私有路径；缺失时模型使用 presence mask。
# ml_air_velocity_m_s = 18.0
ml_context_max_age_seconds = 10.0
ml_max_clipping_fraction = 0.08
ml_max_dropout_fraction = 0.12
ml_spectral_ood_z_limit = 6.0
